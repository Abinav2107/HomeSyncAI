<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeSync AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>🏠 HomeSync AI</h1>
    <p>Smart Living, Simplified</p>
</header>

<section class="status">

    <div class="card">
        <h2>💡 Light</h2>
        <button id="lightBtn">OFF</button>
    </div>

    <div class="card">
        <h2>🌀 Fan</h2>
        <button id="fanBtn">OFF</button>
    </div>

    <div class="card">
        <h2>📶 Device Status</h2>
        <p>🟢 Online</p>
    </div>

    <div class="card">
        <h2>🎤 Alexa</h2>
        <p>Connected</p>
    </div>

    <div class="card">
        <h2>👏 Clap Control</h2>
        <p>Enabled</p>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
